    <meta name="apple-mobile-web-app-capable" content="yes" />

    <div id="apk-download-container" class="hidden fixed bottom-4 left-4 right-4 z-50">
      <a href="/release-apk/FoodHub-Rider.apk" id="download-apk-link" class="block w-full text-center bg-amber-600 text-white font-bold py-3 rounded-xl shadow-lg">

    <script>
      // Hide download button if running as PWA/TWA
      if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
        document.getElementById('apk-download-container').style.display = 'none';
      } else {
        document.getElementById('apk-download-container').classList.remove('hidden');
