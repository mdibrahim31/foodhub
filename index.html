<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ea580c" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ea580c" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#ea580c" />
    <link rel="apple-touch-icon" href="./icons/icon-main-192.png" />
    <link rel="icon" type="image/png" href="./icons/icon-main-192.png" />
    <title>foodiplace - Food Delivery System</title>
    <meta name="description" content="foodiplace: All-in-one Cash-on-Delivery Food Delivery System with Customer App, Vendor Dashboard, Rider App, and Admin Control." />
    <meta property="og:title" content="foodiplace - Food Delivery System" />
    <meta property="og:description" content="foodiplace: All-in-one Cash-on-Delivery Food Delivery System with Customer App, Vendor Dashboard, Rider App, and Admin Control." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script>
      (function() {
        try {
          const hash = (window.location.hash || '').replace('#', '').toLowerCase();
          const params = new URLSearchParams(window.location.search || '');
          const portal = (params.get('portal') || hash).split('?')[0];

          // If opened via shortcut with portal hash/query
          if (portal === 'vendor') {
            window.location.replace('./vendor.html' + window.location.search);
          } else if (portal === 'orders' || portal === 'order' || portal === 'kitchen') {
            window.location.replace('./orders.html' + window.location.search);
          } else if (portal === 'rider') {
            window.location.replace('./rider.html' + window.location.search);
          } else if (portal === 'admin') {
            window.location.replace('./admin.html' + window.location.search);
          } else if (portal === 'subadmin') {
            window.location.replace('./subadmin.html' + window.location.search);
          } else if (portal === 'customer') {
            window.location.replace('./customer.html' + window.location.search);
          }
        } catch (e) {
          console.error('Route error:', e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
