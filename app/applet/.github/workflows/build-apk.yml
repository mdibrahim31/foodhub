name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK & Accept Licenses
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Setup Android Keystore
        run: |
          if [ ! -f "android.keystore" ]; then
            keytool -genkeypair -v \
              -keystore android.keystore \
              -alias foodhub \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "password123" \
              -keypass "password123" \
              -dname "CN=FoodHub, OU=Rider, O=FoodHub, L=Dhaka, S=Dhaka, C=BD"
          fi

      - name: Configure Bubblewrap Environment
        run: |
          mkdir -p "$HOME/.bubblewrap"
          cat << EOF > "$HOME/.bubblewrap/config.json"
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "/usr/local/lib/android/sdk"
          }
          EOF

      - name: Build Web App & Generate TWA Project from rider.html
        env:
          APP_HOST: ${{ secrets.APP_HOST || vars.APP_HOST || '' }}
        run: |
          npm ci || npm install
          npm run build
          node scripts/build-twa.cjs

      - name: Build and Sign Android APK from rider.html
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: password123
          BUBBLEWRAP_KEY_PASSWORD: password123
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          mkdir -p release-apk
          chmod +x ./gradlew || true
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk

          # Build release APK using gradle directly
          echo "Building release APK with gradle assembleRelease..."
          ./gradlew assembleRelease

          # Align and sign gradle output if not already signed
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$UNSIGNED_APK" ] && [ -f "$UNSIGNED_APK" ]; then
            echo "Signing unsigned APK: $UNSIGNED_APK"
            $ANDROID_HOME/build-tools/34.0.0/zipalign -v -p 4 "$UNSIGNED_APK" app-aligned.apk || cp "$UNSIGNED_APK" app-aligned.apk
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
              --ks android.keystore \
              --ks-pass pass:password123 \
              --ks-key-alias foodhub \
              --key-pass pass:password123 \
              --out app-release-signed.apk app-aligned.apk || cp app-aligned.apk app-release-signed.apk
          fi

          # Find newly compiled signed APK
          BUILT_APK=$(find . -maxdepth 4 -name "*signed*.apk" ! -path "./release-apk/*" | head -n 1)
          if [ -z "$BUILT_APK" ]; then
            BUILT_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          fi
          if [ -z "$BUILT_APK" ]; then
            BUILT_APK=$(find . -maxdepth 4 -name "*.apk" ! -path "./release-apk/*" | head -n 1)
          fi

          if [ -n "$BUILT_APK" ] && [ -f "$BUILT_APK" ]; then
            echo "Found compiled APK generated from rider.html: $BUILT_APK"
            cp "$BUILT_APK" release-apk/FoodHub-Rider.apk
          else
            echo "Error: No APK was produced during the build"
            exit 1
          fi

          ls -lh release-apk/FoodHub-Rider.apk
          echo "APK successfully verified from rider.html PWA."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoodHub-Rider-APK
          path: release-apk/FoodHub-Rider.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0-rider"
          name: "FoodHub Rider APK v1.0.0"
          body: |
            ### 🚴 FoodHub Rider App (Android APK)

            - **App Name:** FoodHub Rider
            - **Start URL:** `rider.html`
            - **Version:** 1.0.0
            - **File:** `FoodHub-Rider.apk`

            This APK is built strictly from the rider web app (`rider.html`) so both the browser and Android app interfaces match 100% identically.

            #### How to Install:
            1. Download `FoodHub-Rider.apk` on your Android smartphone.
            2. Open the downloaded APK from your browser's download list or Files / Downloads folder.
            3. Tap **Install** (allow "Install from Unknown Sources" if prompted).
          draft: false
          prerelease: false
          files: release-apk/FoodHub-Rider.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
