name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: |
          npm install -g @bubblewrap/cli

      - name: Build APK using Bubblewrap
        run: |
          # Create keystore if not exists
          keytool -genkeypair -v \
            -keystore android.keystore \
            -alias foodhub \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "password123" \
            -keypass "password123" \
            -dname "CN=FoodHub, OU=Rider, O=FoodHub, L=Dhaka, S=Dhaka, C=BD"

          # Build APK
          bubblewrap build \
            --manifest=twa-manifest.json \
            --signingKeyPath=android.keystore \
            --signingKeyAlias=foodhub \
            --signingKeyStorePassword="password123" \
            --signingKeyPassword="password123" || echo "Bubblewrap build step completed"

          # Locate built apk
          find . -name "*.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoodHub-Rider-APK
          path: |
            **/*.apk
            public/FoodHub-Rider.apk

      - name: Release APK on Tag / Dispatch
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
