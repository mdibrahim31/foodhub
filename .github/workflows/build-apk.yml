name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK & Accept Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Prepare APK Directory
        run: |
          mkdir -p release-apk
          if [ -f "public/FoodHub-Rider.apk" ]; then
            echo "Found public/FoodHub-Rider.apk"
            cp public/FoodHub-Rider.apk release-apk/FoodHub-Rider.apk
          fi

      - name: Optional Bubblewrap TWA Build
        continue-on-error: true
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          mkdir -p "$HOME/.bubblewrap"
          cat << EOC > "$HOME/.bubblewrap/config.json"
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "/usr/local/lib/android/sdk"
          }
          EOC

          npm install -g @bubblewrap/cli --no-fund --no-audit

          if [ ! -f "android.keystore" ]; then
            keytool -genkeypair -v \
              -keystore android.keystore \
              -alias foodhub \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "password123" \
              -keypass "password123" \
              -dname "CN=FoodHub, OU=Rider, O=FoodHub, L=Dhaka, S=Dhaka, C=BD"
          fi

          if [ -f "twa-manifest.json" ]; then
            bubblewrap build \
              --manifest=twa-manifest.json \
              --signingKeyPath=android.keystore \
              --signingKeyAlias=foodhub \
              --signingKeyStorePassword="password123" \
              --signingKeyPassword="password123" || true
          fi

          BUILT_APK=$(find . -maxdepth 3 -name "*.apk" ! -path "./release-apk/*" ! -path "./public/*" | head -n 1)
          if [ -n "$BUILT_APK" ] && [ -f "$BUILT_APK" ]; then
            echo "Found newly built APK: $BUILT_APK"
            cp "$BUILT_APK" release-apk/FoodHub-Rider.apk
          fi

      - name: Verify Final APK
        run: |
          if [ ! -f "release-apk/FoodHub-Rider.apk" ]; then
            if [ -f "public/FoodHub-Rider.apk" ]; then
              cp public/FoodHub-Rider.apk release-apk/FoodHub-Rider.apk
            fi
          fi
          ls -lh release-apk/FoodHub-Rider.apk
          echo "APK successfully verified and ready for download."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoodHub-Rider-APK
          path: release-apk/FoodHub-Rider.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0-rider"
          name: "FoodHub Rider APK v1.0.0"
          body: |
            ### 🚴 FoodHub Rider App (Android APK)

            - **App Name:** FoodHub Rider
            - **Version:** 1.0.0
            - **File:** `FoodHub-Rider.apk`

            #### How to Install:
            1. Download `FoodHub-Rider.apk` below on your Android smartphone.
            2. Open the downloaded file from your browser's download list or Files / Downloads folder.
            3. Tap **Install** (allow "Install from Unknown Sources" if prompted).
          draft: false
          prerelease: false
          files: release-apk/FoodHub-Rider.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
