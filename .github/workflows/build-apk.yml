name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build with Gradle
        run: |
          ./gradlew assembleRelease
      - name: Copy APK to release folder
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/release/*.apk release-apk/FoodHub-Rider.apk
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: FoodHub-Rider-APK
          path: release-apk/FoodHub-Rider.apk
